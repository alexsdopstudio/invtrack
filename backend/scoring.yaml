# Composite score configuration. All weights and thresholds are meant to be
# tuned — this is a research aid, not a black box. Weights are renormalized at
# runtime across the components that actually have data for a ticker.

weights:
  fundamentals: 0.35
  congress: 0.30
  insider: 0.20
  momentum: 0.15

# Benchmark used for excess-return comparisons (track record, politician
# leaderboard). Its prices are ingested alongside watchlist tickers.
benchmark_ticker: SPY

track_record:
  # "Does the score work?" — historical scores joined with what the price did
  # afterwards, vs the benchmark. Purely descriptive, never a forecast.
  horizons_days: [30, 90]
  # Below this many measurable samples the page reports insufficient_data
  # instead of pretending noise is signal.
  min_samples: 8

momentum:
  # Price vs its own 50/200-day moving averages — trend confirmation, not
  # prediction. Blend of percent distances, squashed with tanh(blend/scale):
  # at +/-10% blended distance the signal is ~76% saturated.
  ma_short: 50
  ma_long: 200
  short_weight: 0.6
  long_weight: 0.4
  distance_scale: 0.10
  min_closes: 60   # fewer data points -> component reports missing
  # Relative strength: did the stock beat the benchmark over the window?
  # Up 5% while the market is up 20% is lagging, not leading. Falls back to
  # MA-only when benchmark history is missing.
  rs_weight: 0.4
  rs_window_days: 90
  rs_scale: 0.15

congress:
  # Congressional disclosures are legally delayed up to 45 days (STOCK Act),
  # so this is a lagging signal: recency decay is applied on disclosure_date.
  lookback_days: 90
  decay_half_life_days: 30
  # Net decayed dollars (buy midpoints minus sell midpoints) are squashed with
  # tanh(net / dollar_scale): at +/- dollar_scale the signal is ~76% saturated.
  dollar_scale: 250000
  # Bonus points (on the 0-100 sub-score) when >= cluster_min_members distinct
  # members traded the same direction within cluster_window_days.
  cluster_min_members: 3
  cluster_window_days: 30
  cluster_bonus: 10
  # Skill weighting: a member's trade dollars are scaled by their own
  # historical track record (mean excess return 90 days after their disclosed
  # buys, vs the benchmark). Members without enough measurable history get
  # weight 1.0 — never penalized for missing data.
  member_weighting:
    enabled: true
    min_trades: 2        # measurable past buys required before weighting kicks in
    horizon_days: 90
    min_weight: 0.5
    max_weight: 1.5

insider:
  lookback_days: 90
  decay_half_life_days: 30
  dollar_scale: 1000000
  # Insider selling is noisy (diversification, taxes), so sell dollars are
  # discounted relative to open-market buys...
  sell_discount: 0.5
  # ...and sales flagged as pre-scheduled Rule 10b5-1 plan trades carry no
  # timing signal at all (0.0 = fully excluded from the score).
  plan_sale_discount: 0.0
  # A CFO buying with their own money says more than a board member's token
  # purchase: buy dollars are scaled by the filer's role.
  officer_weight: 1.5
  director_weight: 1.0
  cluster_min_insiders: 2
  cluster_window_days: 30
  cluster_bonus: 10

# Aggressive-growth screener criteria (Screener page). A criterion with no
# data reports "unknown" — never a silent pass or fail. Thresholds follow the
# micro/small-cap growth playbook; tune freely.
screener:
  market_cap: { min: 50000000, max: 2000000000 }  # $50M–$2B: where inefficiencies live
  avg_daily_volume: { min: 150000 }               # shares/day (90d avg) — exit without slippage
  revenue_growth_yoy: { min: 0.25 }               # >25%: product-market fit
  gross_margin: { min: 0.60 }                     # >60%: operating leverage as it scales
  current_ratio: { min: 1.5 }                     # covers 12 months of short-term obligations
  cash_runway_quarters: { min: 4 }                # survives 12+ months without dilutive financing
  insider_ownership: { min: 0.10 }                # >10%: management skin in the game

fundamentals:
  # Each metric maps to a band sub-score (excellent=90, good=70, weak=40,
  # below weak=20); available metrics are averaged. Missing metrics are
  # skipped, never treated as zero.
  revenue_growth_yoy: { excellent: 0.20, good: 0.10, weak: 0.0 }
  operating_margin: { excellent: 0.25, good: 0.15, weak: 0.05 }
  # For these two, lower is better.
  debt_to_equity: { excellent: 0.5, good: 1.0, weak: 2.0 }
  pe: { excellent: 15, good: 25, weak: 40 }
  # Trend adjustment: when an older snapshot (>= min_days_apart days back)
  # exists, a metric that moved by >= min_delta gets a band-score bonus
  # (improving) or penalty (deteriorating) — level and direction both matter.
  trend:
    metrics: [revenue_growth_yoy, operating_margin]
    min_days_apart: 60
    min_delta: 0.02
    bonus: 10
